name: Run Figure S3 temporal trends

on:
  workflow_dispatch:
  push:
    paths:
      - "R_script_FigS3_temporal_trends_DZ.R"
      - "TOT_MET_FLX_v2026_11_13_f.csv"

jobs:
  run-figS3-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run Figure S3 script
        env:
          NEE_DATA_FILE: TOT_MET_FLX_v2026_11_13_f.csv
          NEE_OUTPUT_DIR: Figure_S3_outputs
        run: |
          Rscript R_script_FigS3_temporal_trends_DZ.R

      - name: Upload Figure S3 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Figure-S3-results
          path: Figure_S3_outputs/
          if-no-files-found: warn
