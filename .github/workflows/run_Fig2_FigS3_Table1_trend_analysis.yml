
name: Run Fig. 2, Fig. S5 and Table 1 trend analysis

on:
  push:
    paths:
      - "R_script_Fig2_FigS5_Table1_trend_analysis.R"
      - "TOT_MET_FLX_v2026_11_13_f.csv"
  workflow_dispatch:

jobs:
  run-trend-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        run: Rscript -e 'install.packages(c("zyp", "nlme", "mgcv"), repos = "https://cloud.r-project.org")'

      - name: Run analysis
        run: Rscript R_script_Fig2_FigS5_Table1_trend_analysis.R

      - name: Save outputs
        uses: actions/upload-artifact@v4
        with:
          name: fig2-figS3-table1-outputs
          path: |
            *.csv
            *.tiff
            *.pdf
