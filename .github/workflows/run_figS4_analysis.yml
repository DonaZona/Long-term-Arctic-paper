name: Run Figure S4 correlogram

on:
  workflow_dispatch:
  push:
    paths:
      - "R_script_FigS4_correlogram_DZ.R"
      - "TOT_MET_FLX_v2026_11_13_f.csv"

jobs:
  run-figS4-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Check repository files
        run: |
          echo "Files in repository:"
          find . -maxdepth 2 -type f | sort

      - name: Run Figure S4 script
        env:
          NEE_DATA_FILE: TOT_MET_FLX_v2026_11_13_f.csv
          NEE_OUTPUT_DIR: Figure_S4_outputs
        run: |
          Rscript R_script_FigS4_correlogram_DZ.R

      - name: Upload Figure S4 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Figure-S4-results
          path: Figure_S4_outputs/
          if-no-files-found: warn
