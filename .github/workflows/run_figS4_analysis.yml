name: Run Figure S4 correlogram

on:
  workflow_dispatch:
  push:
    paths:
      - "R_script_FigS4_correlogram_DZ.R"
      - "TOT_MET_FLX_v2026_11_13_f.csv"

jobs:
  run-figS4-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run Fig. S4 script
        run: Rscript R_script_FigS4_correlogram_DZ.R

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: Figure_S4_outputs
          path: |
            FigS4_correlogram.tiff
            FigS4_correlogram.pdf
            FigS4_correlogram_stats.csv
