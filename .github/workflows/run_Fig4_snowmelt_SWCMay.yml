name: Run Fig. 4 snowmelt vs May SWC

on:
  push:
    paths:
      - "R_script_Fig4_snowmelt_SWCMay.R"
      - "TOT_MET_FLX_v2026_11_13_f.csv"
  workflow_dispatch:

jobs:
  run-fig4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run analysis
        run: Rscript R_script_Fig4_snowmelt_SWCMay.R

      - name: Save outputs
        uses: actions/upload-artifact@v4
        with:
          name: fig4-outputs
          path: |
            Fig_4_snowmelt_SWCMay*
